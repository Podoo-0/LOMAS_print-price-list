<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOMAS 계약운임표 생성</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic', sans-serif; font-size: 13px; background: #f4f6f9; color: #333; }

  /* ── 헤더 ── */
  .header { background: #1a3c6e; color: #fff; padding: 0 20px; display: flex; align-items: center; height: 52px; gap: 16px; }
  .header .logo { font-size: 18px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; }
  .header .tabs { display: flex; gap: 4px; flex: 1; }
  .header .tab-btn { background: transparent; border: none; color: rgba(255,255,255,0.7); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .header .tab-btn.active, .header .tab-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .header .update-wrap { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .header .update-status { font-size: 11px; color: rgba(255,255,255,0.6); }
  .btn-update { background: #2ecc71; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; }
  .btn-update:hover { background: #27ae60; }
  .btn-update:disabled { background: #7f8c8d; cursor: not-allowed; }

  /* ── 페이지 ── */
  .page { display: none; padding: 16px 20px; }
  .page.active { display: block; }

  /* ── 카드 ── */
  .card { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; }
  .card-title { font-size: 13px; font-weight: 700; color: #1a3c6e; margin-bottom: 10px; }

  /* ── 버튼 공통 ── */
  .btn { padding: 5px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; font-family: inherit; }
  .btn-primary { background: #1a3c6e; color: #fff; }
  .btn-primary:hover { background: #16335d; }
  .btn-danger { background: #e74c3c; color: #fff; }
  .btn-danger:hover { background: #c0392b; }
  .btn-secondary { background: #ecf0f1; color: #333; border: 1px solid #bdc3c7; }
  .btn-secondary:hover { background: #dfe6e9; }
  .btn-success { background: #27ae60; color: #fff; }
  .btn-success:hover { background: #219a52; }

  /* ── 상차지 카드 ── */
  .pickup-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pickup-row select { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }

  /* ── 태그 리스트 (하차지/차량) ── */
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; min-height: 28px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; background: #eaf0fb; border: 1px solid #afc3e8; color: #1a3c6e; padding: 3px 8px; border-radius: 14px; font-size: 12px; }
  .tag .tag-del { cursor: pointer; color: #7f8c8d; font-size: 14px; line-height: 1; }
  .tag .tag-del:hover { color: #e74c3c; }

  /* ── 운임표 그리드 ── */
  .table-wrap { overflow-x: auto; }
  .fare-table { border-collapse: collapse; min-width: 400px; width: 100%; }
  .fare-table th, .fare-table td { border: 1px solid #dde1e7; padding: 5px 8px; text-align: center; white-space: nowrap; font-size: 12px; }
  .fare-table th { background: #f0f3f8; font-weight: 700; color: #1a3c6e; }
  .fare-table td.left, .fare-table th.left { text-align: left; }
  .fare-table .fare-input { width: 80px; border: none; text-align: right; font-size: 12px; font-family: inherit; background: transparent; }
  .fare-table .fare-input:focus { outline: 1px solid #1a3c6e; border-radius: 2px; background: #fff; }
  .fare-table tr:hover td { background: #f8f9ff; }

  /* ── 모달 ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 10px; padding: 20px; min-width: 320px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { font-size: 15px; font-weight: 700; color: #1a3c6e; margin-bottom: 14px; }
  .modal-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .modal-row label { font-size: 12px; color: #555; width: 60px; flex-shrink: 0; }
  .modal-row select, .modal-row input { flex: 1; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-family: inherit; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .vehicle-type-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .vtype-btn { padding: 5px 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; font-size: 12px; font-family: inherit; background: #f5f5f5; }
  .vtype-btn.selected { background: #1a3c6e; color: #fff; border-color: #1a3c6e; }

  /* ── 맵핑 페이지 ── */
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filter-bar select, .filter-bar input { padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; font-family: inherit; }
  .filter-bar input { width: 180px; }
  .mapping-table { width: 100%; border-collapse: collapse; }
  .mapping-table th, .mapping-table td { border: 1px solid #dde1e7; padding: 5px 8px; font-size: 12px; text-align: center; }
  .mapping-table th { background: #f0f3f8; font-weight: 700; color: #1a3c6e; }
  .mapping-table td.left { text-align: left; }
  .mapping-table .tms-input { width: 90px; border: 1px solid #ccc; border-radius: 3px; padding: 3px 6px; font-size: 12px; font-family: inherit; text-align: center; }
  .mapping-table .tms-input:focus { outline: 1px solid #1a3c6e; }
  .mapping-table tr.mapped td { background: #f0fbf4; }
  .mapping-table tr:hover td { background: #f8f9ff; }
  .info-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: #666; }
  .actions-bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .badge { display: inline-block; background: #e74c3c; color: #fff; border-radius: 10px; padding: 1px 6px; font-size: 10px; margin-left: 4px; }
  .badge.green { background: #27ae60; }

  /* ── 반응형 ── */
  @media (max-width: 600px) {
    .header { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
    .page { padding: 10px 12px; }
  }
</style>
</head>
<body>

<!-- ══════════════════════════ 헤더 ══════════════════════════ -->
<header class="header">
  <div class="logo">LOMAS</div>
  <nav class="tabs">
    <button class="tab-btn active" onclick="showPage('page-fare')">계약운임표 생성</button>
    <button class="tab-btn" onclick="showPage('page-mapping')">차량 코드 맵핑</button>
  </nav>
  <div class="update-wrap">
    <span class="update-status" id="updateStatus">업데이트 필요</span>
    <button class="btn-update" id="btnUpdate" onclick="updateFromSheets()">🔄 차량 업데이트</button>
  </div>
</header>

<!-- ══════════════════════════ PAGE 1: 계약운임표 생성 ══════════════════════════ -->
<div id="page-fare" class="page active">

  <!-- 상차지 -->
  <div class="card">
    <div class="card-title">📍 상차지</div>
    <div class="pickup-row">
      <select id="pickupSido" onchange="onPickupSidoChange()">
        <option value="">시/도 선택</option>
      </select>
      <select id="pickupSigungu" onchange="onPickupSigunguChange()">
        <option value="">시/군/구 선택</option>
      </select>
      <span id="pickupDisplay" style="font-size:12px;color:#666;"></span>
    </div>
  </div>

  <!-- 하차지 -->
  <div class="card">
    <div class="card-title">🏁 하차지</div>
    <div class="tag-list" id="dropoffTags"></div>
    <button class="btn btn-secondary" onclick="openDropoffModal()">+ 하차지 추가</button>
  </div>

  <!-- 차량 -->
  <div class="card">
    <div class="card-title">🚚 차량</div>
    <div class="tag-list" id="vehicleTags"></div>
    <button class="btn btn-secondary" onclick="openVehicleModal()">+ 차량 추가</button>
  </div>

  <!-- 운임표 -->
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>📋 운임표</span>
      <button class="btn btn-success" onclick="downloadExcel()">⬇ 엑셀 다운로드</button>
    </div>
    <div id="fareGrid"><p style="color:#aaa;font-size:12px;">상차지·하차지·차량을 선택하면 운임표가 생성됩니다.</p></div>
  </div>
</div>

<!-- ══════════════════════════ PAGE 2: 차량 코드 맵핑 ══════════════════════════ -->
<div id="page-mapping" class="page">
  <div class="card">
    <div class="card-title">🗂 차량 코드 맵핑</div>
    <div class="filter-bar">
      <select id="filterType" onchange="renderMappingTable()">
        <option value="">전체 차종</option>
      </select>
      <select id="filterTemp" onchange="renderMappingTable()">
        <option value="">전체 특성</option>
        <option value="상온">상온</option>
        <option value="냉장">냉장</option>
        <option value="냉동(냉장포함)">냉동(냉장포함)</option>
        <option value="리프트">리프트</option>
      </select>
      <select id="filterMapped" onchange="renderMappingTable()">
        <option value="">전체</option>
        <option value="mapped">입력됨</option>
        <option value="unmapped">미입력</option>
      </select>
      <input type="text" id="filterSearch" placeholder="단위명 검색..." oninput="renderMappingTable()">
    </div>
    <div class="info-bar">
      <span id="mappingInfo">차량 업데이트 후 표시됩니다.</span>
      <span id="lastUpdated"></span>
    </div>
    <div style="overflow-x:auto;">
      <table class="mapping-table">
        <thead>
          <tr>
            <th>단위명</th>
            <th>차종</th>
            <th>톤수</th>
            <th>특성</th>
            <th>TMS코드</th>
          </tr>
        </thead>
        <tbody id="mappingBody"></tbody>
      </table>
    </div>
    <div class="actions-bar">
      <button class="btn btn-danger" onclick="resetMapping()">전체 초기화</button>
      <button class="btn btn-primary" onclick="saveMapping()">💾 저장</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════ 하차지 모달 ══════════════════════════ -->
<div class="modal-overlay" id="dropoffModal">
  <div class="modal">
    <h3>하차지 추가</h3>
    <div class="modal-row">
      <label>시/도</label>
      <select id="dropoffSido" onchange="onDropoffSidoChange()">
        <option value="">선택</option>
      </select>
    </div>
    <div class="modal-row">
      <label>시/군/구</label>
      <select id="dropoffSigungu">
        <option value="">선택</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('dropoffModal')">취소</button>
      <button class="btn btn-primary" onclick="addDropoff()">추가</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════ 차량 모달 ══════════════════════════ -->
<div class="modal-overlay" id="vehicleModal">
  <div class="modal">
    <h3>차량 추가</h3>
    <div class="modal-row">
      <label>차종</label>
      <div class="vehicle-type-btns" id="vtypeBtns"></div>
    </div>
    <div class="modal-row" id="specRow" style="display:none;">
      <label>세부</label>
      <select id="vehicleSpec"></select>
    </div>
    <div id="vehiclePreview" style="font-size:12px;color:#555;margin-top:6px;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('vehicleModal')">취소</button>
      <button class="btn btn-primary" onclick="addVehicle()">추가</button>
    </div>
  </div>
</div>

</body>
</html>
<script>
/* ════════════════════════════════════════
   전역 상태
════════════════════════════════════════ */
let TMS_UNITS = [];          // Google Sheets에서 로드
let tmsCodeMap = {};         // unitCode → TMS코드(vehicleUnitId)
let LOMAS_MAP = {};          // displayName → {unitCode, label}

const appState = {
  pickup: null,              // { sido, sigungu, display }
  dropoffs: [],              // [{ display }]
  vehicles: [],              // [{ displayName, unitCode }]
  fareMap: {}                // 'dropoff|vehicle' → 금액
};

const SHEETS_ID = '1nn1FLy57tBRcjYWZUII5XgBZ0vPHF3yk-5pOCVaQCEI';

/* ════════════════════════════════════════
   Google Sheets 업데이트
════════════════════════════════════════ */
async function updateFromSheets() {
  const btn = document.getElementById('btnUpdate');
  const status = document.getElementById('updateStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 로딩 중...';
  status.textContent = '';

  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:json`;
    const res = await fetch(url);
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
    if (!match) throw new Error('응답 파싱 실패');
    const data = JSON.parse(match[1]);
    const rows = data.table.rows;

    TMS_UNITS = [];
    tmsCodeMap = {};
    LOMAS_MAP = {};

    rows.forEach(row => {
      const c = row.c;
      const unitCode   = c[0]?.v ?? '';   // A: 차량단위코드
      const unitName   = c[1]?.v ?? '';   // B: 단위명
      const vType      = c[2]?.v ?? '';   // C: 차량종류
      const tonnage    = c[3]?.v ?? '';   // D: 톤수
      const cargoTemp  = c[4]?.v ?? '';   // E: 화물온도
      const desc       = c[5]?.v ?? '';   // F: 설명
      const sortOrder  = c[6]?.v ?? 0;    // G: 정렬
      const tmsCode    = c[7]?.v ?? '';   // H: TMS코드

      if (!unitCode) return;

      const unit = { unitCode, unitName, vType, tonnage, cargoTemp, desc, sortOrder, tmsCode };
      TMS_UNITS.push(unit);

      if (tmsCode) {
        tmsCodeMap[unitCode] = tmsCode;
        LOMAS_MAP[unitName] = { unitCode, label: buildLabel(unit) };
      }
    });

    // 정렬순 유지
    TMS_UNITS.sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));

    // 맵핑 페이지 로컬스토리지 적용
    loadSavedMapping();

    // UI 재구성
    rebuildVehicleTypeFilter();
    rebuildMappingTypeFilter();
    renderMappingTable();

    const now = new Date().toLocaleString('ko-KR');
    status.textContent = `✅ ${TMS_UNITS.length}건 (${now})`;
    document.getElementById('lastUpdated').textContent = `최근 업데이트: ${now}`;
    document.getElementById('mappingInfo').textContent = `총 ${TMS_UNITS.length}건`;
  } catch (e) {
    status.textContent = '❌ 업데이트 실패';
    alert('차량 데이터 로드 실패: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 차량 업데이트';
  }
}

function buildLabel(unit) {
  const parts = [];
  if (unit.vType)     parts.push(unit.vType);
  if (unit.tonnage)   parts.push(unit.tonnage);
  if (unit.cargoTemp) parts.push(unit.cargoTemp);
  return parts.join(' ');
}

/* ════════════════════════════════════════
   지역 데이터
════════════════════════════════════════ */
const SIDO_LIST = [

  '경기','강원','충북','충남','전북','전남','경북','경남','제주'

  '대구': ['군위군','남구','달서구','달성군','동구','북구','서구','수성구','중구'],
  '인천': ['강화군','계양구','남동구','동구','미추홀구','부평구','서구','연수구','옹진군','중구'],

  '강원': ['강릉시','고성군','동해시','삼척시','속초시','양구군','양양군','영월군','원주시','인제군','정선군','철원군','춘천시','태백시','평창군','홍천군','화천군','횡성군'],
  '충북': ['괴산군','단양군','보은군','영동군','옥천군','음성군','제천시','증평군','진천군','청주시','충주시'],

function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  const idx = pageId === 'page-fare' ? 0 : 1;
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
}

/* ════════════════════════════════════════
   상차지
════════════════════════════════════════ */
function initPickupSidos() {
  const sel = document.getElementById('pickupSido');
  SIDO_LIST.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

function initDropoffSidos() {
  const sel = document.getElementById('dropoffSido');
  sel.innerHTML = '<option value="">선택</option>';
  SIDO_LIST.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

function onPickupSidoChange() {
  const sido = document.getElementById('pickupSido').value;
  const sg = document.getElementById('pickupSigungu');
  sg.innerHTML = '<option value="">시/군/구 선택</option>';
  if (sido && SIGUNGU_MAP[sido]) {
    SIGUNGU_MAP[sido].forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sg.appendChild(opt);
    });
  }
  appState.pickup = null;
  document.getElementById('pickupDisplay').textContent = '';
  renderGrid();
}

function onPickupSigunguChange() {
  const sido = document.getElementById('pickupSido').value;
  const sigungu = document.getElementById('pickupSigungu').value;
  if (sido && sigungu) {
    appState.pickup = { sido, sigungu, display: `${sido} ${sigungu}` };
    document.getElementById('pickupDisplay').textContent = `✔ ${sido} ${sigungu}`;
  } else {
    appState.pickup = null;
    document.getElementById('pickupDisplay').textContent = '';
  }
  renderGrid();
}

/* ════════════════════════════════════════
   하차지 모달
════════════════════════════════════════ */
function openDropoffModal() {
  initDropoffSidos();
  document.getElementById('dropoffSigungu').innerHTML = '<option value="">선택</option>';
  openModal('dropoffModal');
}

function onDropoffSidoChange() {
  const sido = document.getElementById('dropoffSido').value;
  const sg = document.getElementById('dropoffSigungu');
  sg.innerHTML = '<option value="">선택</option>';
  if (sido && SIGUNGU_MAP[sido]) {
    SIGUNGU_MAP[sido].forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      sg.appendChild(opt);
    });
  }
}

function addDropoff() {
  const sido = document.getElementById('dropoffSido').value;
  const sigungu = document.getElementById('dropoffSigungu').value;
  if (!sido || !sigungu) { alert('시/도와 시/군/구를 모두 선택해주세요.'); return; }
  const display = `${sido} ${sigungu}`;
  if (appState.dropoffs.find(d => d.display === display)) {
    alert('이미 추가된 하차지입니다.'); return;
  }
  appState.dropoffs.push({ display });
  closeModal('dropoffModal');
  renderDropoffTags();
  renderGrid();
}

function removeDropoff(display) {
  appState.dropoffs = appState.dropoffs.filter(d => d.display !== display);
  // 해당 하차지 운임 삭제
  Object.keys(appState.fareMap).forEach(k => {
    if (k.startsWith(display + '|')) delete appState.fareMap[k];
  });
  renderDropoffTags();
  renderGrid();
}

function renderDropoffTags() {
  const el = document.getElementById('dropoffTags');
  el.innerHTML = appState.dropoffs.map(d =>
    `<span class="tag">${d.display}<span class="tag-del" onclick="removeDropoff('${d.display}')">×</span></span>`
  ).join('');
}

/* ════════════════════════════════════════
   차량 모달
════════════════════════════════════════ */
function rebuildVehicleTypeFilter() {
  const types = [...new Set(TMS_UNITS.map(u => u.vType).filter(Boolean))];
  const btns = document.getElementById('vtypeBtns');
  if (!btns) return;
  btns.innerHTML = types.map(t =>
    `<button class="vtype-btn" onclick="onVtypeSelect(this,'${t}')">${t}</button>`
  ).join('');
}

function openVehicleModal() {
  if (TMS_UNITS.length === 0) {
    alert('먼저 "🔄 차량 업데이트" 버튼을 눌러 차량 데이터를 불러오세요.');
    return;
  }
  rebuildVehicleTypeFilter();
  document.getElementById('specRow').style.display = 'none';
  document.getElementById('vehicleSpec').innerHTML = '';
  document.getElementById('vehiclePreview').textContent = '';
  document.querySelectorAll('.vtype-btn').forEach(b => b.classList.remove('selected'));
  openModal('vehicleModal');
}

function onVtypeSelect(btn, type) {
  document.querySelectorAll('.vtype-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  const specs = getVehicleSpecs(type);
  const specRow = document.getElementById('specRow');
  const specSel = document.getElementById('vehicleSpec');

  if (specs.length > 0) {
    specSel.innerHTML = specs.map(s =>
      `<option value="${s.unitCode}">${s.label}</option>`
    ).join('');
    specRow.style.display = 'flex';
    updateVehiclePreview();
  } else {
    specRow.style.display = 'none';
    document.getElementById('vehiclePreview').textContent = '';
  }
}

function getVehicleSpecs(type) {
  return TMS_UNITS
    .filter(u => u.vType === type)
    .map(u => ({
      unitCode: u.unitCode,
      label: [u.tonnage, u.cargoTemp].filter(Boolean).join(' ') || u.unitName
    }));
}

function updateVehiclePreview() {
  const unitCode = document.getElementById('vehicleSpec').value;
  const unit = TMS_UNITS.find(u => u.unitCode === unitCode);
  if (unit) {
    document.getElementById('vehiclePreview').textContent =
      `단위명: ${unit.unitName}`;
  }
}

function addVehicle() {
  const selectedBtn = document.querySelector('.vtype-btn.selected');
  if (!selectedBtn) { alert('차종을 선택해주세요.'); return; }

  const specRow = document.getElementById('specRow');
  let unitCode, displayName;

  if (specRow.style.display !== 'none') {
    unitCode = document.getElementById('vehicleSpec').value;
    const unit = TMS_UNITS.find(u => u.unitCode === unitCode);
    if (!unit) { alert('차량 정보를 찾을 수 없습니다.'); return; }
    displayName = unit.unitName;
  } else {
    const type = selectedBtn.textContent;
    const unit = TMS_UNITS.find(u => u.vType === type);
    if (!unit) { alert('차량 정보를 찾을 수 없습니다.'); return; }
    unitCode = unit.unitCode;
    displayName = unit.unitName;
  }

  if (appState.vehicles.find(v => v.unitCode === unitCode)) {
    alert('이미 추가된 차량입니다.'); return;
  }

  appState.vehicles.push({ displayName, unitCode });
  closeModal('vehicleModal');
  renderVehicleTags();
  renderGrid();
}

function removeVehicle(unitCode) {
  const v = appState.vehicles.find(v => v.unitCode === unitCode);
  if (v) {
    appState.vehicles = appState.vehicles.filter(v => v.unitCode !== unitCode);
    Object.keys(appState.fareMap).forEach(k => {
      if (k.endsWith('|' + v.displayName)) delete appState.fareMap[k];
    });
  }
  renderVehicleTags();
  renderGrid();
}

function renderVehicleTags() {
  const el = document.getElementById('vehicleTags');
  el.innerHTML = appState.vehicles.map(v =>
    `<span class="tag">${v.displayName}<span class="tag-del" onclick="removeVehicle('${v.unitCode}')">×</span></span>`
  ).join('');
}

/* ════════════════════════════════════════
   운임표 렌더링
════════════════════════════════════════ */
function fareKey(dropoff, vehicleName) {
  return dropoff + '|' + vehicleName;
}

function getLomasHeader(displayName) {
  const info = LOMAS_MAP[displayName];
  if (!info) return null;
  const tmsCode = tmsCodeMap[info.unitCode];
  if (!tmsCode) return null;
  return `${displayName}[${tmsCode}]`;
}

function renderGrid() {
  const area = document.getElementById('fareGrid');
  const { pickup, dropoffs, vehicles } = appState;

  if (!pickup || dropoffs.length === 0 || vehicles.length === 0) {
    area.innerHTML = '<p style="color:#aaa;font-size:12px;">상차지·하차지·차량을 선택하면 운임표가 생성됩니다.</p>';
    return;
  }

  let html = '<div class="table-wrap"><table class="fare-table"><thead><tr>';
  html += '<th class="left">상차지역</th><th class="left">하차지역</th>';
  vehicles.forEach(v => {
    const lomasHeader = getLomasHeader(v.displayName);
    const thLabel = lomasHeader
      ? lomasHeader.replace(/\[(\d+)\]/, '<br><span style="font-size:10px;color:#888;">[$1]</span>')
      : v.displayName;
    html += `<th>${thLabel}</th>`;
  });
  html += '</tr></thead><tbody>';

  dropoffs.forEach(d => {
    html += `<tr>
      <td class="left">${pickup.display}</td>
      <td class="left">${d.display}</td>`;
    vehicles.forEach(v => {
      const key = fareKey(d.display, v.displayName);
      const val = appState.fareMap[key] ?? '';
      html += `<td><input class="fare-input" type="number" min="0" step="100"
        value="${val}" data-key="${key}" onchange="onFareChange(this)"></td>`;
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  area.innerHTML = html;
}

function onFareChange(input) {
  const key = input.dataset.key;
  const val = input.value.trim();
  if (val === '') {
    delete appState.fareMap[key];
  } else {
    appState.fareMap[key] = Number(val);
  }
}
/* ════════════════════════════════════════
   엑셀 다운로드
════════════════════════════════════════ */
function downloadExcel() {
  const { pickup, dropoffs, vehicles } = appState;
  if (!pickup || dropoffs.length === 0 || vehicles.length === 0) {
    alert('상차지, 하차지, 차량을 모두 선택해주세요.');
    return;
  }

  // SheetJS CDN 동적 로드
  if (typeof XLSX === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
    script.onload = () => doDownloadExcel();
    document.head.appendChild(script);
  } else {
    doDownloadExcel();
  }
}

function doDownloadExcel() {
  const { pickup, dropoffs, vehicles } = appState;

  // 헤더행
  const header = ['상차지역', '하차지역', ...vehicles.map(v => {
    const info = LOMAS_MAP[v.displayName];
    const tmsCode = info ? tmsCodeMap[info.unitCode] : null;
    return tmsCode ? `${v.displayName}[${tmsCode}]` : v.displayName;
  })];

  // 데이터행
  const rows = dropoffs.map(d => {
    const row = [pickup.display, d.display];
    vehicles.forEach(v => {
      const key = fareKey(d.display, v.displayName);
      row.push(appState.fareMap[key] ?? '');
    });
    return row;
  });

  const wsData = [header, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(wsData);

  // 열 너비 설정
  ws['!cols'] = [
    { wch: 16 }, { wch: 16 },
    ...vehicles.map(() => ({ wch: 14 }))
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '계약운임표');

  const now = new Date();
  const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `계약운임표_${pickup.display}_${stamp}.xlsx`);
}

/* ════════════════════════════════════════
   맵핑 페이지 — 테이블 렌더링
════════════════════════════════════════ */
function renderMappingTable() {
  const typeFilter   = document.getElementById('filterType')?.value ?? '';
  const tempFilter   = document.getElementById('filterTemp')?.value ?? '';
  const mappedFilter = document.getElementById('filterMapped')?.value ?? '';
  const searchFilter = (document.getElementById('filterSearch')?.value ?? '').trim().toLowerCase();

  let filtered = TMS_UNITS.filter(u => {
    if (typeFilter   && u.vType      !== typeFilter)   return false;
    if (tempFilter   && u.cargoTemp  !== tempFilter)   return false;
    if (searchFilter && !u.unitName.toLowerCase().includes(searchFilter)) return false;
    const hasTms = !!tmsCodeMap[u.unitCode];
    if (mappedFilter === 'mapped'   && !hasTms) return false;
    if (mappedFilter === 'unmapped' &&  hasTms) return false;
    return true;
  });

  const tbody = document.getElementById('mappingBody');
  if (!tbody) return;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:#aaa;padding:16px;">표시할 항목이 없습니다.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(u => {
    const tmsVal = tmsCodeMap[u.unitCode] ?? '';
    const mapped = !!tmsVal;
    return `<tr class="${mapped ? 'mapped' : ''}">
      <td class="left">${u.unitName}</td>
      <td>${u.vType || ''}</td>
      <td>${u.tonnage || ''}</td>
      <td>${u.cargoTemp || ''}</td>
      <td><input class="tms-input" type="text" value="${tmsVal}"
        data-unit="${u.unitCode}"
        onchange="onTmsInputChange(this)"
        placeholder="TMS코드"></td>
    </tr>`;
  }).join('');

  // 맵핑 현황 업데이트
  const totalMapped = TMS_UNITS.filter(u => !!tmsCodeMap[u.unitCode]).length;
  document.getElementById('mappingInfo').textContent =
    `총 ${TMS_UNITS.length}건 · 입력됨 ${totalMapped}건 · 미입력 ${TMS_UNITS.length - totalMapped}건`;
}

function onTmsInputChange(input) {
  const unitCode = input.dataset.unit;
  const val = input.value.trim();
  if (val) {
    tmsCodeMap[unitCode] = val;
    const unit = TMS_UNITS.find(u => u.unitCode === unitCode);
    if (unit) LOMAS_MAP[unit.unitName] = { unitCode, label: buildLabel(unit) };
    input.closest('tr').classList.add('mapped');
  } else {
    delete tmsCodeMap[unitCode];
    const unit = TMS_UNITS.find(u => u.unitCode === unitCode);
    if (unit) delete LOMAS_MAP[unit.unitName];
    input.closest('tr').classList.remove('mapped');
  }
  // 맵핑 현황 숫자 갱신
  const totalMapped = TMS_UNITS.filter(u => !!tmsCodeMap[u.unitCode]).length;
  document.getElementById('mappingInfo').textContent =
    `총 ${TMS_UNITS.length}건 · 입력됨 ${totalMapped}건 · 미입력 ${TMS_UNITS.length - totalMapped}건`;
}

/* ════════════════════════════════════════
   맵핑 저장 / 불러오기 / 초기화
════════════════════════════════════════ */
function saveMapping() {
  localStorage.setItem('lomasTmsCodeMap', JSON.stringify(tmsCodeMap));
  alert(`저장 완료 (${Object.keys(tmsCodeMap).length}건)`);
}

function loadSavedMapping() {
  const saved = localStorage.getItem('lomasTmsCodeMap');
  if (!saved) return;
  try {
    const map = JSON.parse(saved);
    // Sheets 데이터가 이미 로드된 후 적용 (Sheets 값 우선)
    Object.entries(map).forEach(([unitCode, tmsCode]) => {
      if (!tmsCodeMap[unitCode] && tmsCode) {
        tmsCodeMap[unitCode] = tmsCode;
        const unit = TMS_UNITS.find(u => u.unitCode === unitCode);
        if (unit) LOMAS_MAP[unit.unitName] = { unitCode, label: buildLabel(unit) };
      }
    });
  } catch(e) {
    console.warn('맵핑 로드 실패:', e);
  }
}

function resetMapping() {
  if (!confirm('모든 TMS코드 입력값을 초기화하시겠습니까?')) return;
  tmsCodeMap = {};
  LOMAS_MAP = {};
  localStorage.removeItem('lomasTmsCodeMap');
  renderMappingTable();
}
